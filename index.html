<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>DC Web | Home</title>
    <meta name="description" content="Latest updates and statistic charts">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="assets/favicon.ico" />

    <!-- Google WebFont Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Core Stylesheet -->
    <link href="css/style.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <div class="page-wrapper">
        <!-- Main Content Area -->
        <main class="main-content">
            <div class="kt-portlet">
                <div class="kt-portlet__body">
                    
                    <!-- Header Branding Row -->
                    <div class="brand-row">
                        <img src="assets/logo-greenwich.png" alt="University of Greenwich" class="brand-logo-left" />
                        <img src="assets/logo-smart-verify.png" alt="Smart Verify Plus" class="brand-logo-right" />
                    </div>

                    <!-- Verification Status Alert Banner -->
                    <div class="alert-success-banner" role="alert">
                        <div class="alert-icon">
                            <i class="fa-regular fa-circle-check"></i>
                        </div>
                        <div class="alert-text">
                            This document is valid and was issued by University of Greenwich to Pham Van Xuan on 19 Jul 2026
                        </div>
                    </div>

                    <!-- Document Viewer Component -->
                    <div class="report-viewer-container">
                        
                        <!-- Viewer Toolbar (PDFJS Express style) -->
                        <div class="viewer-toolbar">
                            <div class="toolbar-left">
                                <!-- Sidebar Toggle -->
                                <button type="button" class="toolbar-btn" id="btnSidebar" title="Toggle Sidebar">
                                    <svg viewBox="0 0 24 24">
                                        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                                        <line x1="9" y1="3" x2="9" y2="21"></line>
                                    </svg>
                                </button>

                                <!-- Page Single View -->
                                <button type="button" class="toolbar-btn" id="btnPageView" title="Page View">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                        <polyline points="14 2 14 8 20 8"></polyline>
                                    </svg>
                                </button>

                                <!-- Zoom Dropdown -->
                                <div class="zoom-dropdown-wrapper">
                                    <button type="button" class="zoom-select-btn" id="zoomSelectBtn">
                                        <span id="zoomSelectText">69%</span>
                                        <svg viewBox="0 0 24 24" fill="none">
                                            <polyline points="6 9 12 15 18 9"></polyline>
                                        </svg>
                                    </button>
                                    <div class="zoom-menu" id="zoomMenu">
                                        <div class="zoom-menu-item" data-value="fit-page">Fit Page</div>
                                        <div class="zoom-menu-item" data-value="fit-width">Fit Width</div>
                                        <div class="zoom-menu-item" data-value="0.5">50%</div>
                                        <div class="zoom-menu-item selected" data-value="0.69">69%</div>
                                        <div class="zoom-menu-item" data-value="0.75">75%</div>
                                        <div class="zoom-menu-item" data-value="1.0">100%</div>
                                        <div class="zoom-menu-item" data-value="1.25">125%</div>
                                        <div class="zoom-menu-item" data-value="1.5">150%</div>
                                        <div class="zoom-menu-item" data-value="2.0">200%</div>
                                    </div>
                                </div>

                                <!-- Zoom Out -->
                                <button type="button" class="toolbar-btn" id="btnZoomOut" title="Zoom Out">
                                    <svg viewBox="0 0 24 24">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <line x1="8" y1="12" x2="16" y2="12"></line>
                                    </svg>
                                </button>

                                <!-- Zoom In -->
                                <button type="button" class="toolbar-btn" id="btnZoomIn" title="Zoom In">
                                    <svg viewBox="0 0 24 24">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <line x1="12" y1="8" x2="12" y2="16"></line>
                                        <line x1="8" y1="12" x2="16" y2="12"></line>
                                    </svg>
                                </button>

                                <div class="toolbar-divider"></div>

                                <!-- Hand Tool -->
                                <button type="button" class="toolbar-btn" id="btnHandTool" title="Pan / Hand Tool">
                                    <svg viewBox="0 0 24 24">
                                        <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v3"></path>
                                        <path d="M14 9V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v7"></path>
                                        <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
                                        <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path>
                                    </svg>
                                </button>
                            </div>

                            <div class="toolbar-right">
                                <!-- Settings Gear -->
                                <button type="button" class="toolbar-btn" id="btnSettings" title="Viewer Settings">
                                    <svg viewBox="0 0 24 24">
                                        <circle cx="12" cy="12" r="3"></circle>
                                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                                    </svg>
                                </button>
                                <div class="settings-menu" id="settingsMenu">
                                    <div class="settings-header">Document Viewer</div>
                                    <div class="settings-item" onclick="document.getElementById('btnPageView').click()">
                                        <i class="fa-regular fa-file"></i> Single Page View
                                    </div>
                                    <div class="settings-item" onclick="document.getElementById('zoomMenu').querySelector('[data-value=\'fit-page\']').click()">
                                        <i class="fa-solid fa-expand"></i> Fit to Window
                                    </div>
                                    <div class="settings-item" onclick="document.getElementById('zoomMenu').querySelector('[data-value=\'0.69\']').click()">
                                        <i class="fa-solid fa-rotate-left"></i> Reset Zoom (69%)
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Viewer Stage (Sidebar + Viewport) -->
                        <div class="viewer-stage-container">
                            <!-- Sidebar (Thumbnails) -->
                            <div class="viewer-sidebar" id="viewerSidebar">
                                <div class="thumbnail-card">
                                    <div class="thumbnail-preview">
                                        <img src="assets/xuan-thumb.png" alt="Thumbnail Page 1" />
                                    </div>
                                    <div class="thumbnail-label">1</div>
                                </div>
                            </div>

                            <!-- Document Viewport -->
                            <div class="document-viewport" id="documentViewport">
                                <div class="certificate-wrapper" id="certificateWrapper">
                                    <div class="certificate-sheet">
                                        <img src="assets/xuan.png" id="certImage" alt="University of Greenwich Official Certificate" />
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                    <!-- End Document Viewer -->

                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="kt-footer">
            <div class="footer-container">
                <div class="footer-copyright">
                    2026 &copy; DSSL
                </div>
                <div class="footer-nav">
                    <a href="https://graduatedocsverifyqr.gre.ac.uk/Pages/Privacy" target="_blank" rel="noopener noreferrer">Privacy</a>
                    <a href="https://graduatedocsverifyqr.gre.ac.uk/Pages/Faq" target="_blank" rel="noopener noreferrer">FAQ</a>
                    <a href="https://graduatedocsverifyqr.gre.ac.uk/Pages/Cookies" target="_blank" rel="noopener noreferrer">Cookies</a>
                    <a href="https://graduatedocsverifyqr.gre.ac.uk/Pages/Terms" target="_blank" rel="noopener noreferrer">Terms</a>
                    <a href="https://graduatedocsverifyqr.gre.ac.uk/Pages/Support" target="_blank" rel="noopener noreferrer">Support</a>
                </div>
            </div>
        </footer>
    </div>

    <!-- Viewer Controller Script -->
    <script src="js/viewer.js"></script>
</body>
</html>
